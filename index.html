<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lacey</title>
<style>
  :root { --text:#3a1a24; --pink:#ff5fa2; --pink2:#ff8cc0; --btn:rgba(255,255,255,.78); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    min-height:100vh; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(135deg,#fbe4ee,#f2c4d6,#eab0c8,#f6d3e1);
    background-size:300% 300%; animation:bg 14s ease infinite;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  main { max-width:480px; margin:0 auto; padding-bottom:40px; }

  .cover { position:relative; height:210px; background:#eab0c8 url("cover.jpg") center/cover no-repeat; border-radius:0 0 32px 32px; overflow:hidden; }
  .cover::after { content:""; position:absolute; inset:0; background:linear-gradient(to bottom,rgba(255,255,255,0) 55%,rgba(240,170,200,.55)); }

  .avatar-wrap {
    width:128px; height:128px; border-radius:50%; margin:-64px auto 0; position:relative; z-index:2;
    padding:4px; background:linear-gradient(135deg,#fff,var(--pink2),var(--pink));
    box-shadow:0 8px 28px rgba(255,95,162,.45);
  }
  .avatar { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:3px solid #fff; background:#fff; }

  .head { text-align:center; padding:0 20px; }
  h1 { margin-top:14px; font-size:26px; font-weight:800; letter-spacing:.5px; }
  .tag { display:inline-block; margin:10px 0 26px; padding:6px 16px; font-size:12px; letter-spacing:3px; text-transform:uppercase; font-weight:700;
    background:rgba(255,255,255,.65); border-radius:999px; }

  .links { padding:0 18px; }
  a.btn {
    position:relative; display:flex; align-items:center; justify-content:center; gap:10px; overflow:hidden;
    text-decoration:none; color:var(--text); background:var(--btn);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.9); border-radius:999px; padding:19px 16px; margin-bottom:14px;
    font-size:14px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    box-shadow:0 4px 14px rgba(150,50,95,.10); transition:transform .15s, box-shadow .15s;
  }
  a.btn:hover, a.btn:active { transform:translateY(-3px) scale(1.01); box-shadow:0 10px 22px rgba(150,50,95,.22); }

  /* Icons */
  svg.i { width:19px; height:19px; flex:none; display:block; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  svg.i.f { fill:currentColor; stroke:none; }

  a.cta {
    flex-direction:column; gap:3px; padding:22px 16px; color:#fff; border:none;
    background:linear-gradient(135deg,var(--pink),#ff3d8b);
    box-shadow:0 10px 26px rgba(255,61,139,.45); font-size:16px;
    animation:pulse 2.4s ease-in-out infinite;
  }
  a.cta .row { display:flex; align-items:center; gap:10px; }
  a.cta::before {
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg); animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes shine { 0%{left:-60%} 55%,100%{left:130%} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }

  .sep { display:flex; align-items:center; gap:12px; margin:22px 6px 16px; font-size:11px; letter-spacing:3px; text-transform:uppercase; opacity:.6; }
  .sep::before, .sep::after { content:""; flex:1; height:1px; background:currentColor; opacity:.35; }

  footer { margin-top:26px; text-align:center; font-size:11px; letter-spacing:1px; opacity:.6; padding:0 20px; line-height:1.7; }

  /* 18+ gate */
  .gate {
    position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; padding:16px;
    background:rgba(58,26,36,.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .gate[hidden] { display:none; }
  .gate-box {
    width:100%; max-width:340px; text-align:center; padding:28px 22px 22px;
    background:rgba(255,255,255,.92); border:1px solid #fff; border-radius:28px;
    box-shadow:0 16px 40px rgba(150,50,95,.30); animation:pop .2s ease-out;
  }
  @keyframes pop { from{transform:scale(.92); opacity:0} to{transform:scale(1); opacity:1} }
  .gate-title { font-size:22px; font-weight:800; margin-bottom:8px; }
  .gate-text { font-size:14px; line-height:1.5; opacity:.75; margin-bottom:22px; }
  .gate-actions { display:flex; flex-direction:column; gap:10px; }
  .gate-actions button {
    font:inherit; font-size:13px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    padding:16px; border:none; border-radius:999px; cursor:pointer;
  }
  .gate-yes { color:#fff; background:linear-gradient(135deg,var(--pink),#ff3d8b); box-shadow:0 8px 20px rgba(255,61,139,.40); }
  .gate-no { color:var(--text); background:rgba(243,198,215,.55); }

  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>

<!-- 18+ gate -->
<div id="gate" class="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate-box">
    <p id="gate-title" class="gate-title">18+ only 🔞</p>
    <p class="gate-text">this part is just for adults babe. are u over 18?</p>
    <div class="gate-actions">

      <button class="gate-no" onclick="closeGate()">no, take me back</button>
    </div>
  </div>

<script>
  var gate = document.getElementById('gate');
  function openGate(e){ e.preventDefault(); gate.hidden = false; }
  function closeGate(){ gate.hidden = true; }
  function enter(){ window.location.href = '/go'; }
  gate.addEventListener('click', function(e){ if (e.target === gate) closeGate(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeGate(); });
</script>
